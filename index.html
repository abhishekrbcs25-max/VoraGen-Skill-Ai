<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VoraGen Skill AI — Adaptive Career, Resume & Skill Intelligence</title>
    <meta name="description" content="AI-powered adaptive learning platform with multi-agent skill analysis, resume builder, personalized roadmaps, AI video mentorship, 50,000+ coding challenges, skill games, and 20,000+ global company job matching." />
    <meta property="og:title" content="VoraGen Skill AI — Adaptive Career, Resume & Skill Intelligence" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('pathforge-theme') || 'dark';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-[#0B2545]/15 selection:text-[#0B2545] dark:selection:bg-amber-400/25 dark:selection:text-amber-300">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
